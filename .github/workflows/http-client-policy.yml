name: HTTP client policy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-http-client-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tls:
    name: TLS verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore only: a PR's copy is readable only by that PR and competes
          # with the shared caches cache-warm.yml seeds on main.
          save-if: false
      - name: Test certificate policy and HTTP behavior
        run: cargo test --locked -p wealthfolio-http
