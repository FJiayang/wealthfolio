name: Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images (version tags only)
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/server/**"
      - "crates/storage-sqlite/**"
      - "crates/core/src/profiles/**"
      - "crates/core/src/secrets/**"
      - "crates/device-sync/**"
      - "crates/connect/**"
      - "crates/core/src/connect_config.rs"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/scripts/**"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Connect build configuration
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_STORAGE_ALLOWED_HOSTS: ${{ secrets.CONNECT_STORAGE_ALLOWED_HOSTS }}
        run: python3 .github/scripts/check_connect_build.py --github-env
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
      - name: Build native image once
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wealthfolio-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
          # Third-party Rust dependencies exported by cache-warm.yml. Read before
          # any registry login, so PRs (including forks') import it anonymously.
          # Release tags skip it: every ref shares that cache tag, so published
          # images compile their dependencies here.
          cache-from:
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=registry,ref=ghcr.io/{0}/wealthfolio-build-cache:deps-{1}',
            github.repository_owner, matrix.arch) || '' }}
          # Secret values do not invalidate Docker's cache; compile current destinations.
          no-cache-filters: backend
          secrets: |
            connect-storage-hosts=${{ env.CONNECT_STORAGE_ALLOWED_HOSTS }}
          build-args: |
            CONNECT_AUTH_URL=${{ vars.CONNECT_AUTH_URL }}
            CONNECT_AUTH_PUBLISHABLE_KEY=${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
            CONNECT_API_URL=${{ vars.CONNECT_API_URL }}
      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-smoke:ci
      - name: Log into GHCR
        if: (github.event_name == 'push' || inputs.publish) && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload tested image under a staging tag
        if: (github.event_name == 'push' || inputs.publish) && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/wealthfolio
          STAGING_TAG: ci-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          docker tag wealthfolio-smoke:ci "$GHCR_IMAGE:$STAGING_TAG"
          docker push "$GHCR_IMAGE:$STAGING_TAG"

  publish:
    # Release tags move only after BOTH architectures have passed their tests.
    needs: build
    if: (github.event_name == 'push' || inputs.publish) && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,format=long
      - name: Publish manifests from tested images (no rebuild)
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          STAGING_PREFIX: ci-${{ github.run_id }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            image="${tag%:*}"
            docker buildx imagetools create --tag "$tag" \
              "$image:$STAGING_PREFIX-amd64" "$image:$STAGING_PREFIX-arm64"
          done <<< "$RELEASE_TAGS"
