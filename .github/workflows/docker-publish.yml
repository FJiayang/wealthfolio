name: Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images (version tags only)
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/server/**"
      - "crates/storage-sqlite/**"
      - "crates/core/src/profiles/**"
      - "crates/core/src/secrets/**"
      - "crates/device-sync/**"
      - "crates/connect/**"
      - "crates/core/src/connect_config.rs"
      - "config/**"
      - "fork-release.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/scripts/**"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fork: ${{ steps.policy.outputs.fork }}
      publish: ${{ steps.policy.outputs.publish }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_fork_release.py'
      - name: Validate release identity before building
        id: policy
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: |
          args=()
          if [ "$PUBLISH_REQUESTED" = "true" ]; then args+=(--publish); fi
          python3 .github/scripts/fork_release.py \
            --repository "$REPOSITORY" --ref "$RELEASE_REF" \
            --event "$EVENT_NAME" "${args[@]}" >> "$GITHUB_OUTPUT"

  build:
    needs: release-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Connect build configuration
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_STORAGE_ALLOWED_HOSTS: ${{ secrets.CONNECT_STORAGE_ALLOWED_HOSTS }}
        run: python3 .github/scripts/check_connect_build.py --github-env
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          labels: |
            org.opencontainers.image.version=${{ needs.release-policy.outputs.fork == 'true' && needs.release-policy.outputs.version || github.ref_name }}
      - name: Build native image once
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wealthfolio-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
          # Third-party Rust dependencies exported by cache-warm.yml. Read before
          # any registry login, so PRs (including forks') import it anonymously.
          # Release tags skip it: every ref shares that cache tag, so published
          # images compile their dependencies here.
          cache-from:
            ${{ !startsWith(github.ref, 'refs/tags/') &&
            format('type=registry,ref=ghcr.io/{0}/wealthfolio-build-cache:deps-{1}',
            github.repository_owner, matrix.arch) || '' }}
          # Secret values do not invalidate Docker's cache; compile current destinations.
          no-cache-filters: backend
          secrets: |
            connect-storage-hosts=${{ env.CONNECT_STORAGE_ALLOWED_HOSTS }}
          build-args: |
            CONNECT_AUTH_URL=${{ vars.CONNECT_AUTH_URL }}
            CONNECT_AUTH_PUBLISHABLE_KEY=${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
            CONNECT_API_URL=${{ vars.CONNECT_API_URL }}
      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-smoke:ci
      - name: Log into GHCR
        if: needs.release-policy.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload tested image under a staging tag
        if: needs.release-policy.outputs.publish == 'true'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/wealthfolio
          STAGING_TAG: ci-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          docker tag wealthfolio-smoke:ci "$GHCR_IMAGE:$STAGING_TAG"
          docker push "$GHCR_IMAGE:$STAGING_TAG"

  publish:
    # Release tags move only after BOTH architectures have passed their tests.
    needs: [release-policy, build]
    if: needs.release-policy.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=raw,value=${{ needs.release-policy.outputs.version }},enable=${{ needs.release-policy.outputs.fork == 'true' }},priority=900
            type=semver,pattern={{version}},enable=${{ needs.release-policy.outputs.fork != 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.release-policy.outputs.fork != 'true' }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,format=long
      - name: Publish manifests from tested images (no rebuild)
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          STAGING_PREFIX: ci-${{ github.run_id }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            image="${tag%:*}"
            docker buildx imagetools create --tag "$tag" \
              "$image:$STAGING_PREFIX-amd64" "$image:$STAGING_PREFIX-arm64"
          done <<< "$RELEASE_TAGS"
